# Publishes to PyPI when a version tag (v*) is pushed. PyPI "trusted
# publishing": no token is stored; PyPI trusts this repository, this workflow
# and the `pypi` environment (set up once under the project's Publishing page).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: |
          python -m unittest discover -s tests
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the next step can tell where the tagged
          # commit sits relative to main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release from a commit that was merged into main"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - name: The tag must equal the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["TAG"]
          if tag != "v" + version:
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print("tag", tag, "matches version", version)
          PY
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      - name: Check the metadata
        run: twine check --strict dist/*
      - name: The source distribution passes its own tests
        run: |
          set -e
          work="$RUNNER_TEMP/sdist-check"
          rm -rf "$work"; mkdir -p "$work/src"
          tar -xzf dist/*.tar.gz -C "$work/src"
          python -m venv "$work/venv"
          "$work/venv/bin/pip" install dist/*.tar.gz
          cd "$work"/src/*/
          "$work/venv/bin/python" -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    # Only this job may mint the OIDC token PyPI exchanges for upload rights.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
