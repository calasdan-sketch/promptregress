      #   env:
      #     PROMPTREGRESS_BASE_URL: ${{ secrets.PROMPTREGRESS_BASE_URL }}
      #     PROMPTREGRESS_API_KEY: ${{ secrets.PROMPTREGRESS_API_KEY }}
      #     PROMPTREGRESS_MODEL: llama3.1
      #   run: promptregress run --all --no-cache --timeout 60
