[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptregress"
version = "0.2.0"
description = "Pytest for prompts: catch LLM regressions before your users do."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Calas Automations Inc."}]
keywords = ["llm", "prompts", "regression-testing", "prompt-engineering", "ci", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/promptregress"
Repository = "https://github.com/calasdan-sketch/promptregress"
Issues = "https://github.com/calasdan-sketch/promptregress/issues"

[project.optional-dependencies]
# Only for `pytest --promptregress` (promptregress.pytest); the tool itself
# needs nothing.
pytest = ["pytest>=7.0"]

[project.scripts]
promptregress = "promptregress.cli:main"

# pytest finds the plugin by itself; it does nothing without --promptregress.
[project.entry-points.pytest11]
promptregress = "promptregress.pytest"

[tool.setuptools]
packages = ["promptregress"]

[tool.setuptools.package-data]
promptregress = ["py.typed"]
